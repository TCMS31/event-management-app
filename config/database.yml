# PostgreSQL configuration.
#
# Every value is read from the environment so that no credential is ever committed.
# `DATABASE_URL`, when present, overrides everything below (Rails merges it on top).
# See .env.example for the full list.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>
  # For details on connection pooling, see the Rails configuration guide:
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "event_management_app_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "event_management_app_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "event_management_app_production") %>
